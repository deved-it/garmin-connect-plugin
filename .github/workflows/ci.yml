name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-groups
      - run: uv run pytest --cov=garmin_connect_plugin --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python scripts/smoke_package.py --source-tree .
      - run: uv run python scripts/build_release.py --dry-run
