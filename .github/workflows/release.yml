name: Build and release standalone packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --locked --all-groups
      - run: uv run pytest
      - run: uv run python scripts/build_release.py
      - run: uv run python scripts/smoke_package.py --archive dist/releases/garmin-personal-plugin-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: garmin-personal-plugin-${{ matrix.target }}
          path: |
            dist/releases/*.zip
            dist/releases/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: garmin-personal-plugin-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and publish release
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            garmin-personal-plugin-macos-arm64.zip
            garmin-personal-plugin-macos-arm64.zip.sha256
            garmin-personal-plugin-windows-x64.zip
            garmin-personal-plugin-windows-x64.zip.sha256
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing or empty release asset: $asset" >&2; exit 1; }
          done
          sha256sum --check garmin-personal-plugin-macos-arm64.zip.sha256
          sha256sum --check garmin-personal-plugin-windows-x64.zip.sha256

          prerelease=false
          version_without_metadata="${RELEASE_TAG%%+*}"
          if [[ "$RELEASE_TAG" == v0.* || "$version_without_metadata" == *-* ]]; then
            prerelease=true
          fi
          release_flags=("--prerelease=$prerelease")
          if [[ "$prerelease" == true ]]; then
            release_flags+=(--latest=false)
          fi

          if ! gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
