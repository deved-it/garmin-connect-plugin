[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-personal-plugin"
version = "0.1.0"
description = "Local, read-only Garmin Connect Personal API plugin for ChatGPT and Codex"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mcp>=1.26,<2", "garmin-connect-personal-api-python==1.0.0", "platformdirs>=4,<5", "python-dotenv>=1,<2", "pydantic>=2.12,<3", "tzdata>=2025.2"]

[project.scripts]
garmin-personal-plugin = "garmin_connect_plugin.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "pyright>=1.1,<2"]
build = ["pyinstaller>=6.16,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
